[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-diag-cli"
version = "0.4.1"
description = "OpenClaw observer-only diagnostic CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "OpenClaw"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
ocdiag = "ocdiag.dispatcher:main"

[tool.setuptools]
packages = ["ocdiag", "diag", "tools"]
include-package-data = true

[tool.setuptools.package-data]
diag = ["*.py"]
tools = ["*.py"]
