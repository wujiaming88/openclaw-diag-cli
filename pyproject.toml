[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-diag-cli"
version = "1.8.5"
description = "OpenClaw observer-only diagnostic CLI — built for humans and AI Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "wujiaming88"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
# Test-only dependencies. The runtime ocdiag package is zero-dep on purpose;
# pytest is opt-in for contributors who want to run tests/test_panorama.py
# and tests/test_v2_*.py. Stdlib-only test runners under tests/run_*.py keep
# working without it. Install with: ``pip install -e ".[dev]"``.
dev = [
    "pytest>=7",
]

[project.scripts]
ocdiag = "ocdiag.main:main"

[tool.setuptools.packages.find]
include = ["ocdiag*"]

[tool.setuptools.package-data]
ocdiag = ["*.py"]
